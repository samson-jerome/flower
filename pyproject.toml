[project]
name = "flower"
dynamic = ["version"]
requires-python = ">=3.11"
dependencies = [
    "pyside6>=6.7",
    "lxml>=5.0",
    "pygments>=2.19",
]

[project.scripts]
flower = "flower.app.main:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/flower"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
