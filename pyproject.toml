[project]
name = "flower"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pyside6>=6.7",
    "lxml>=5.0",
    "pygments>=2.19",
]

[project.scripts]
flower = "flower.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flower"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
